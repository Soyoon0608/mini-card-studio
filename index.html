<!-- 템플릿 -->

<div class="template-box">

    <h2>
        📁 템플릿 관리
    </h2>


    <input
        type="text"
        id="templateName"
        class="template-name-input"
        maxlength="30"
        placeholder="템플릿 이름"
    >


    <button
        type="button"
        id="saveTemplateButton"
        class="template-save-button">

        💾 새 템플릿 저장

    </button>


    <p
        id="templateMessage"
        class="template-message">
    </p>


    <div
        class="template-transfer">

        <button
            type="button"
            id="exportTemplateButton">

            📤 JSON 내보내기

        </button>


        <label
            for="importTemplateInput"
            class="template-import-button">

            📥 JSON 가져오기

        </label>


        <input
            type="file"
            id="importTemplateInput"
            accept=".json,application/json"
        >

    </div>


    <div
        id="templateList"
        class="template-list">

        <p class="template-empty">
            저장된 템플릿이 없습니다.
        </p>

    </div>

</div>
